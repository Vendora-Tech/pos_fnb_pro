name: odoo20-pos

services:
  db:
    image: postgres:18
    user: root
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-odoo20_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    restart: unless-stopped
    volumes:
      - ./postgresql:/var/lib/postgresql/18/docker      # PGDATA for PostgreSQL 18+

  odoo20:
    image: odoo:20
    user: root
    depends_on:
      - db
    ports:
      - "${ODOO_WEB_PORT:-10020}:8069"
      - "${ODOO_CHAT_PORT:-20020}:8072"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=${POSTGRES_USER:-odoo20_user}
      - PASSWORD=${POSTGRES_PASSWORD}
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    restart: unless-stopped
